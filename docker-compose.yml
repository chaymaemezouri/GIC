services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "file:/data/dev.db"
      JWT_SECRET: "change-me-in-production"
      PORT: 4000
      FRONTEND_URL: "http://localhost:5173"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - gic-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  gic-data:
