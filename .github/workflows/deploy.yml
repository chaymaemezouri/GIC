name: Deploy GIC to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            bash -ic 'cd /var/www/projects/gic || exit 1
            bash deploy.sh || echo "deploy.sh a retourné une erreur, compilation forcée ensuite"
            echo "NPM=$(command -v npm || echo MISSING)"
            npm install --prefix backend || exit 1
            npm install --prefix frontend || exit 1
            npm run db:push --prefix backend || exit 1
            npm run build --prefix backend || exit 1
            npm run build --prefix frontend || exit 1
            if command -v pm2 >/dev/null 2>&1; then pm2 restart all --update-env || echo "pm2 restart ignoré"; fi
            mkdir -p tmp backend/tmp
            touch tmp/restart.txt backend/tmp/restart.txt
            test -f frontend/dist/index.html || exit 1
            echo "DEPLOY_OK $(git rev-parse --short HEAD)"
            npm run seed || echo "Seed ignoré (données déjà présentes)"'
